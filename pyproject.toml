[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "control-flow-engine"
version = "0.1.0"
description = "Control flow engine and visualization tools for OpenProject"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Justin Bates", email = "justin@justinbates.dev"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers", 
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.8"
dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
    "jinja2>=3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0", 
    "black>=22.0",
    "flake8>=5.0",
    "mypy>=1.0"
]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0"
]

[project.urls]
Homepage = "https://github.com/JustinCBates/control-flow"
Repository = "https://github.com/JustinCBates/control-flow"
Documentation = "https://github.com/JustinCBates/control-flow#readme"
Issues = "https://github.com/JustinCBates/control-flow/issues"

[project.scripts]
flow-engine = "control_flow_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--strict-markers", "--strict-config"]

[tool.black]
line-length = 88
target-version = ["py38"]