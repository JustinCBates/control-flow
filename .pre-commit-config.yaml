exclude: |
  (?x)^(
    tests/|
    demos/|
    examples/|
    archive/|
    tools/|
    .*\.egg-info/
  )

repos:
  - repo: https://github.com/psf/black
    rev: 25.9.0
    hooks:
      - id: black
        name: black (python)
        language_version: python3
        args: ["--line-length=88"]
        files: ^(src|scripts|bin)/.*\.py$

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      # Relax F401 on src for now; will tighten incrementally
      - id: flake8
        name: flake8 (src - relaxed)
        additional_dependencies: []
        # Relax some rules initially; tighten incrementally
        args: ["--max-line-length=88", "--extend-ignore=E203,E402,E501,F401,F541,F821,F841,W293"]
        files: ^src/.*\.py$

      # Enforce F401 for CLI modules now (stricter)
      - id: flake8
        name: flake8 (cli - strict F401)
        additional_dependencies: []
        # Keep other ignores but DO NOT ignore F401 here
        args: ["--max-line-length=88", "--extend-ignore=E203,E402,E501,F541,F821,F841,W293"]
        files: ^src/control_flow_engine/cli/.*\.py$

      # Enforce F401 for top-level scripts/bin
      - id: flake8
        name: flake8 (scripts/bin - strict F401)
        additional_dependencies: []
        args: ["--max-line-length=88", "--extend-ignore=E203,E402,E501,F541,F821,F841,W293"]
        files: ^(scripts|bin)/.*\.py$

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.19.0
    hooks:
      - id: pyupgrade
        args: ["--py38-plus"]
        files: ^(src|scripts|bin)/.*\.py$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
        files: ^(src|scripts|bin)/
      - id: trailing-whitespace
        files: ^(src|scripts|bin)/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
